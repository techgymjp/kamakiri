<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>格闘カマキリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <!-- システムボタン -->
      <div id="sys" class="hidden">
        <button id="pauseBtn" aria-label="一時停止">Ⅱ</button>
        <button id="muteBtn" aria-label="音のオン/オフ">♪</button>
        <button id="fsBtn" aria-label="全画面">⛶</button>
      </div>
    </div>

    <!-- タイトル -->
    <div id="title" class="overlay">
      <h1>格闘<span>カマキリ</span></h1>
      <p class="sub">KAKUTO KAMAKIRI — 3D</p>
      <div class="menu">
        <button id="startBtn" class="primary">勝ち抜きバトル スタート</button>
        <button id="continueBtn" class="hidden">つづきから</button>
      </div>
      <p class="lead">6匹のカマキリが順番に登場。勝つほど相手が強くなる！</p>
      <div class="howto keyboard-only">
        <table>
          <tr><td>移動</td><td>A / D（← / →）</td></tr>
          <tr><td>ジャンプ</td><td>W（↑）</td></tr>
          <tr><td>ガード</td><td>S（↓）</td></tr>
          <tr><td>カマジャブ（弱）</td><td>J</td></tr>
          <tr><td>大鎌斬り（強）</td><td>K</td></tr>
          <tr><td>旋風鎌（必殺）</td><td>L</td></tr>
        </table>
        <p>空中で攻撃すると「急降下鎌」。必殺技は気力ゲージを50使います。P / Esc で一時停止、M で消音。</p>
      </div>
      <div class="howto touch-only">
        <p>左のパッドで移動（上下にずらすとジャンプ／ガード）、右のボタンで攻撃。<br>空中で「弱」「強」を押すと急降下鎌。「必」は気力ゲージ50で発動。<br>横向き画面がおすすめです。</p>
      </div>
    </div>

    <!-- 結果 -->
    <div id="pause" class="overlay hidden">
      <h2>PAUSE</h2>
      <div class="menu">
        <button id="resumeBtn" class="primary">再開</button>
        <button id="retryBtn">最初からやり直す</button>
        <button id="pauseTitleBtn">タイトルへ</button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <h2 id="resultText"></h2>
      <div class="menu">
        <button id="againBtn" class="primary">もう一度</button>
        <button id="titleBtn">タイトルへ</button>
      </div>
    </div>

    <!-- タッチ操作（スマホ） -->
    <div id="touch" class="hidden">
      <div id="pad">
        <span class="lbl up">ジャンプ</span>
        <span class="lbl left">◀</span>
        <span class="lbl right">▶</span>
        <span class="lbl down">ガード</span>
        <div id="knob"></div>
      </div>
      <div class="btns">
        <button data-key="KeyW" class="b-jump">ジャンプ</button>
        <button data-key="KeyS" class="b-guard">ガード</button>
        <button data-key="KeyJ" class="b-light">弱<small>カマジャブ</small></button>
        <button data-key="KeyK" class="b-heavy">強<small>大鎌斬り</small></button>
        <button data-key="KeyL" class="b-sp">必<small>旋風鎌</small></button>
      </div>
    </div>

  </div>
  <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
  <script type="module" src="game.js"></script>
</body>
</html>
