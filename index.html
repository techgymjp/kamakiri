<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>格闘カマキリ / Kakuto Kamakiri</title>
  <meta name="description" content="本物のカマキリを3Dで再現した格闘ゲーム。A 3D fighting game starring realistic praying mantises." />
  <meta property="og:title" content="格闘カマキリ / Kakuto Kamakiri" />
  <meta property="og:description" content="勝ち抜きバトルで真のカマキリ王を目指せ！ Fight your way to become the true Mantis King!" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <!-- システムボタン -->
      <div id="sys" class="hidden">
        <button id="pauseBtn" data-i18n-aria="aPause">Ⅱ</button>
        <button id="muteBtn" data-i18n-aria="aMute">♪</button>
        <button id="fsBtn" data-i18n-aria="aFull">⛶</button>
      </div>
    </div>

    <!-- タイトル（トップ） -->
    <div id="title" class="overlay">
      <button id="langBtn" class="lang">English</button>
      <h1 data-i18n-html="logo">格闘<span>カマキリ</span></h1>
      <p class="sub" data-i18n="subtitle">KAKUTO KAMAKIRI — 3D</p>
      <p class="lead" data-i18n="lead">6匹のカマキリが順番に登場。勝つほど相手が強くなる！</p>
      <p id="bestRecord" class="best"></p>
      <p id="loadMsg" class="load"></p>
      <div class="menu">
        <button id="startBtn" class="primary" data-i18n="start">プレイ</button>
        <button id="continueBtn" class="hidden">つづきから</button>
        <button id="howtoBtn" data-i18n="howto">あそびかた</button>
      </div>
      <div id="legal">
        <span id="buildInfo"></span>
        <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="privacy">プライバシーポリシー</a>
        <span id="adPrivacy" class="hidden">| <a href="#" id="adPrivacyLink" data-i18n="adSettings">広告の設定</a></span>
      </div>
    </div>

    <!-- あそびかた -->
    <div id="howtoScreen" class="overlay hidden">
      <h2 data-i18n="howto">あそびかた</h2>
      <div class="howto keyboard-only">
        <table>
          <tr><td data-i18n="cMove">移動</td><td>A / D（← / →）</td></tr>
          <tr><td data-i18n="cJump">ジャンプ</td><td>W（↑）</td></tr>
          <tr><td data-i18n="cGuard">ガード</td><td>S（↓）</td></tr>
          <tr><td data-i18n="cLight">カマジャブ（弱）</td><td>J</td></tr>
          <tr><td data-i18n="cHeavy">大鎌斬り（強）</td><td>K</td></tr>
          <tr><td data-i18n="cSpecial">旋風鎌（必殺）</td><td>L</td></tr>
        </table>
        <p data-i18n="kbNote">空中で攻撃すると「急降下鎌」。必殺技は気力ゲージを50使います。P / Esc で一時停止、M で消音。</p>
      </div>
      <div class="howto touch-only">
        <p data-i18n-html="touchNote">左のパッドで移動（上下にずらすとジャンプ／ガード）、右のボタンで攻撃。</p>
      </div>
      <p class="howto" data-i18n="rules">各ステージ2本先取。全6ステージを勝ち抜くとクリア！</p>
      <div class="menu">
        <button id="howtoPlayBtn" class="primary" data-i18n="start">プレイ</button>
        <button id="howtoBackBtn" data-i18n="toTitle">タイトルへ</button>
      </div>
    </div>

    <!-- リワード広告：負けたラウンドのやり直し（アプリのみ） -->
    <div id="redo" class="hidden">
      <p id="redoTitle" data-i18n="redoTitle">このラウンドをやり直す？</p>
      <button id="redoWatch" class="primary">広告を見てやり直す</button>
      <button id="redoNext">このまま進む</button>
      <small id="redoNote"></small>
    </div>

    <!-- 一時停止 -->
    <div id="pause" class="overlay hidden">
      <h2>PAUSE</h2>
      <div class="menu">
        <button id="resumeBtn" class="primary" data-i18n="resume">再開</button>
        <button id="retryBtn" data-i18n="retry">最初からやり直す</button>
        <button id="pauseTitleBtn" data-i18n="toTitle">タイトルへ</button>
      </div>
    </div>

    <!-- 結果 -->
    <div id="result" class="overlay hidden">
      <h2 id="resultText"></h2>
      <div class="menu">
        <button id="againBtn" class="primary">もう一度</button>
        <button id="shareBtn" class="share" data-i18n="share">結果をシェア</button>
        <button id="titleBtn" data-i18n="toTitle">タイトルへ</button>
      </div>
      <p id="shareMsg" class="lead"></p>
    </div>

    <!-- タッチ操作（スマホ） -->
    <div id="touch" class="hidden">
      <div id="pad">
        <span class="lbl up" data-i18n="cJump">ジャンプ</span>
        <span class="lbl left">◀</span>
        <span class="lbl right">▶</span>
        <span class="lbl down" data-i18n="cGuard">ガード</span>
        <div id="knob"></div>
      </div>
      <div class="btns">
        <button data-key="KeyJ" class="b-light" data-i18n-html="bLight">弱<small>カマジャブ</small></button>
        <button data-key="KeyK" class="b-heavy" data-i18n-html="bHeavy">強<small>大鎌斬り</small></button>
        <button data-key="KeyL" class="b-sp" data-i18n-html="bSp">必<small>旋風鎌</small></button>
      </div>
    </div>

  </div>
  <script src="ads-config.js"></script>
  <script src="build-info.js"></script>
  <script src="ads.js"></script>
  <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
  <script type="module" src="game.js"></script>
</body>
</html>
